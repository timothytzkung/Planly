services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: planly-mongo
    restart: always
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      # Database the app uses (matches the "/wqb" in MONGO_WQB_URI)
      MONGODB_INITDB_DATABASE: wqb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: server/Dockerfile
    container_name: planly-backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      MONGO_WQB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/wqb?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5050
    depends_on:
      mongodb:
        condition: service_healthy

  mongo-express:
    image: mongo-express
    container_name: planly-mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
